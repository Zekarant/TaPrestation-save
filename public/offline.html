<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - TaPrestation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.8;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #f97316;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #94a3b8;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
        }
        .tips {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-align: left;
        }
        .tips h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .tips ul {
            list-style: none;
            font-size: 14px;
        }
        .tips li {
            padding: 8px 0;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tips li::before {
            content: '•';
            color: #f97316;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
        </svg>
        
        <h1>Vous êtes hors ligne</h1>
        <p>Impossible de se connecter à Internet. Vérifiez votre connexion et réessayez.</p>
        
        <a href="/" class="btn" onclick="window.location.reload(); return false;">
            Réessayer
        </a>
        
        <div class="tips">
            <h3>Conseils :</h3>
            <ul>
                <li>Vérifiez votre connexion Wi-Fi ou données mobiles</li>
                <li>Activez le mode avion puis désactivez-le</li>
                <li>Rapprochez-vous de votre routeur</li>
            </ul>
        </div>
    </div>

    <script>
        // Auto-reload when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
